name: RF Waterfall CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install conan

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Install CUDA toolkit
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2604/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y cuda-nvcc-13-4 cuda-cudart-dev-13-4 libcufft-dev-13-4

      - name: Add CUDA to PATH
        run: |
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
          echo "CUDA_PATH=/usr/local/cuda" >> "$GITHUB_ENV"

      - name: Build project
        run: make build
